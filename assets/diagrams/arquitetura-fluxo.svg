<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura em alto nivel do Sorterama</title>
  <desc id="desc">Fluxo entre cliente, loja, backoffice, plataforma, dados, fila, pagamento, fiscal, comunicacao, relatorios e resultados publicos.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; rx: 12; }
      .label { fill: #111827; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .small { fill: #4b5563; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .line { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1040" height="620"/>
  <text x="520" y="42" class="label" style="font-size:26px">Arquitetura em alto nivel</text>
  <rect class="box" x="70" y="115" width="170" height="72"/><text class="label" x="155" y="146">Cliente</text><text class="small" x="155" y="168">compra e acompanha</text>
  <rect class="box" x="310" y="115" width="170" height="72"/><text class="label" x="395" y="146">Loja Web</text><text class="small" x="395" y="168">catalogo e checkout</text>
  <rect class="box" x="310" y="400" width="170" height="72"/><text class="label" x="395" y="431">Backoffice</text><text class="small" x="395" y="453">operacao interna</text>
  <rect class="core" x="570" y="240" width="220" height="96"/><text class="label" x="680" y="278">API e Regras</text><text class="label" x="680" y="304">de Negocio</text>
  <rect class="box" x="850" y="75" width="150" height="68"/><text class="label" x="925" y="105">Pagamento</text><text class="small" x="925" y="126">Pix</text>
  <rect class="box" x="850" y="175" width="150" height="68"/><text class="label" x="925" y="207">Dados</text><text class="small" x="925" y="228">PostgreSQL</text>
  <rect class="box" x="850" y="275" width="150" height="68"/><text class="label" x="925" y="306">Fila</text><text class="small" x="925" y="327">assincrona</text>
  <rect class="box" x="850" y="375" width="150" height="68"/><text class="label" x="925" y="406">Fiscal</text><text class="small" x="925" y="427">NFS-e</text>
  <rect class="box" x="570" y="465" width="170" height="68"/><text class="label" x="655" y="495">Comunicacao</text><text class="small" x="655" y="516">e-mail e mensagens</text>
  <rect class="box" x="110" y="275" width="170" height="68"/><text class="label" x="195" y="305">Resultados</text><text class="small" x="195" y="326">publicos</text>
  <rect class="box" x="110" y="465" width="170" height="68"/><text class="label" x="195" y="495">Relatorios</text><text class="small" x="195" y="516">conciliacao</text>
  <path class="line" d="M240 151 H310"/>
  <path class="line" d="M480 151 C535 151 545 288 570 288"/>
  <path class="line" d="M480 436 C535 436 545 298 570 298"/>
  <path class="line" d="M790 274 C825 240 825 110 850 110"/>
  <path class="line" d="M790 288 H850"/>
  <path class="line" d="M790 306 H850"/>
  <path class="line" d="M925 343 V375"/>
  <path class="line" d="M670 336 V465"/>
  <path class="line" d="M570 304 C470 315 380 315 280 315"/>
  <path class="line" d="M280 300 C360 230 410 205 395 187"/>
  <path class="line" d="M570 322 C445 395 330 475 280 500"/>
</svg>
